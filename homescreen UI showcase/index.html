<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Bonk Race — Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ===== BACKGROUND SCENE (all CSS-drawn) ===== -->
    <div class="scene">
        <div class="sky"></div>
        <div class="clouds">
            <div class="cloud c1"></div>
            <div class="cloud c2"></div>
            <div class="cloud c3"></div>
            <div class="cloud c4"></div>
            <div class="cloud c5"></div>
        </div>
        <div class="floor">
            <div class="floor-surface"></div>
        </div>
        <!-- Decorative map obstacles in the background -->
        <div class="obstacle spinner" style="--ox:18%;--oy:52%"></div>
        <div class="obstacle spinner" style="--ox:78%;--oy:50%"></div>
        <div class="obstacle bar" style="--ox:12%;--oy:60%"></div>
        <div class="obstacle bar rot" style="--ox:85%;--oy:58%"></div>
        <div class="obstacle pad" style="--ox:90%;--oy:68%"></div>
        <div class="obstacle piston" style="--ox:8%;--oy:65%"></div>
        <div class="flag flag-left"></div>
        <div class="flag flag-right"></div>
    </div>

    <!-- ===== CHARACTER (center, CSS-drawn racer blob) ===== -->
    <div class="character-container">
        <div class="character" id="mainChar">
            <div class="char-shadow"></div>
            <div class="char-body">
                <div class="char-highlight"></div>
                <div class="char-eyes">
                    <div class="eye left"><div class="pupil"></div></div>
                    <div class="eye right"><div class="pupil"></div></div>
                </div>
                <div class="char-feet">
                    <div class="foot left"></div>
                    <div class="foot right"></div>
                </div>
            </div>
            <div class="char-crown">▼</div>
        </div>
    </div>

    <!-- ===== UI OVERLAY ===== -->
    <div class="ui">
        <!-- Top Bar -->
        <header class="top-bar">
            <div class="profile-card" id="profileCard">
                <div class="avatar">
                    <div class="avatar-blob">
                        <div class="avatar-eye l"></div>
                        <div class="avatar-eye r"></div>
                    </div>
                </div>
                <div class="player-info">
                    <span class="player-name">Player Name</span>
                    <span class="player-level">Level 1</span>
                    <div class="xp-bar"><div class="xp-fill"></div></div>
                </div>
            </div>
            <div class="top-right">
                <div class="currency" id="currGems">
                    <div class="curr-icon gems-icon">◆</div>
                    <span class="curr-val">2,450</span>
                    <button class="curr-add" aria-label="Buy gems">+</button>
                </div>
                <div class="currency" id="currCoins">
                    <div class="curr-icon coins-icon">●</div>
                    <span class="curr-val">680</span>
                    <button class="curr-add" aria-label="Buy coins">+</button>
                </div>
                <button class="settings-btn" id="settingsBtn" aria-label="Settings">⚙</button>
            </div>
        </header>

        <!-- Left Sidebar -->
        <nav class="sidebar left-sidebar">
            <button class="side-btn" id="btnRewards">
                <div class="side-icon rewards-icon">🎁</div>
                <span class="side-label">Rewards</span>
                <span class="notif-badge">!</span>
            </button>
            <button class="side-btn" id="btnCollectibles">
                <div class="side-icon collectibles-icon">⭐</div>
                <span class="side-label">Collectibles</span>
                <span class="notif-badge">!</span>
            </button>
            <button class="side-btn" id="btnOffer">
                <div class="side-icon offer-icon">🎀</div>
                <span class="side-label">Offer</span>
            </button>
        </nav>

        <!-- Right Sidebar -->
        <nav class="sidebar right-sidebar">
            <button class="side-btn" id="btnFriends">
                <div class="side-icon friends-icon">👥</div>
                <span class="side-label">Friends</span>
            </button>
            <button class="side-btn" id="btnClan">
                <div class="side-icon clan-icon">🛡️</div>
                <span class="side-label">Clan</span>
            </button>
        </nav>

        <!-- Bottom Bar -->
        <footer class="bottom-bar">
            <div class="season-banner" id="seasonBanner">
                <div class="season-megaphone">📣</div>
                <div class="season-content">
                    <span class="season-title">SEASON OFFER</span>
                    <span class="season-sub">Limited Time!</span>
                </div>
                <div class="season-sparkles">✨</div>
            </div>
            <button class="play-btn" id="playBtn">
                <span class="play-triangle">▶</span>
                <span class="play-text">PLAY</span>
            </button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
